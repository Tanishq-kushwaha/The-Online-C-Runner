<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Online C Runner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="slyle.css">

</head>

<body>

        <!-- Navbar -->

        <nav class="navbar navbar-dark bg-dark">
            <div class="container justify-content-center">
                <a class="navbar-brand fw-bold m-0">
                    The Online C Runner
                </a>
            </div>
        </nav>

        <!-- Main -->

        <main class="container mt-4">

            <div class="row g-4">

                <section class="col-lg-7">

                    <!-- Editor Header -->
                    <div class="editor-header">

                       <h5 class="editor-title">C Editor</h5>

                        <button class="btn btn-success run-btn" id="runBtn">
                            ▶ Run Code
                        </button>

                    </div>

                    <!-- Code Editor -->
                    <textarea class="form-control editor" placeholder="Write your C code here..."></textarea>

                </section>
                <section class="col-lg-5">

                    <div id="terminal" class="terminal">

                        <div class="terminal-header">
                            OUTPUT
                        </div>

                        <div class="terminal-body">
                           <p> Your output will appear here...</p>
                        </div>

                    </div>

                </section>


            </div>

        </main>


    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
