<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Online C Runner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/slyle.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-dark">
        <div class="container justify-content-center">
            <a class="navbar-brand fw-bold m-0">
                The Online C Runner
            </a>
        </div>
    </nav>

    <!-- Main -->

    <main class="container mt-4">

        <div class="row g-4">

            <section class="col-lg-7">

                <!-- Editor Header -->
                <div class="editor-header">

                    <h5 class="editor-title">C Editor</h5>

                    <button class="btn btn-success run-btn" id="runBtn">
                        ▶ Run Code
                    </button>

                </div>

                <!-- Code Editor -->
                <textarea class="form-control editor" placeholder="Write your C code here..."></textarea>

            </section>
            <section class="col-lg-5">

                <div id="terminal" class="terminal">

                    <div class="terminal-header">
                        OUTPUT
                    </div>

                    <div class="terminal-body">
                        <pre> Your output will appear here...</pre>
                    </div>

                </div>

            </section>


        </div>

    </main>

    <!-- Footer -->
    <footer class="footer mt-5">
        <div class="container text-center">
            <p class="footer-text">
                Crafted with ❤️ and countless cups of chai by
                <span class="developer-name">Tanishq Kushwaha</span>
            </p>

            <div class="footer-links">
                <a href="https://github.com/Tanishq-kushwaha" target="_blank">GitHub</a>
                <span>•</span>
                <a href="https://tanishq-kushwaha.github.io/tanishq-portfolio/" target="_blank">Portfolio</a>
            </div>
        </div>
    </footer>

    <!-- Under Development Modal -->

    <div class="modal fade" id="devModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        🚧 Under Development
                    </h5>
                </div>
                <div class="modal-body">
                    <p>
                        Thank you for visiting <strong>The Online C Runner</strong>.
                    </p>
                    <p>
                        This project is currently under development.
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">
                        OK
                    </button>
                </div>
            </div>
        </div>
    </div>


    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
